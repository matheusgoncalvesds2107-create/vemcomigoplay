<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta name="theme-color" content="#020812">

  <title>Painel Vem Comigo PLAY</title>

  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <header class="topbar">

    <div class="brand">

      <img
        src="logo-play.png"
        alt="Vem Comigo PLAY"
      >

      <div>
        <strong>
          Painel Vem Comigo PLAY
        </strong>

        <span>
          Vem Comigo Records
        </span>
      </div>

    </div>

    <a
      href="index.html"
      class="back"
    >
      Ver site
    </a>

  </header>


  <main>

    <!-- =========================
         ENVIAR MÚSICA
    ========================== -->

    <section class="panel">

      <div class="panel-title">

        <small>
          CATÁLOGO
        </small>

        <h1>
          Publicar música
        </h1>

        <p>
          Envie músicas próprias ou autorizadas
          para o Vem Comigo PLAY.
        </p>

      </div>


      <form id="musicForm">

        <!-- ARTISTA LIVRE -->

        <label>
          Artista

          <input
            id="artist"
            type="text"
            list="artistSuggestions"
            placeholder="Ex: Henrique Santana"
            autocomplete="off"
            required
          >

          <datalist id="artistSuggestions">

            <option value="Lucas & Ana Paula"></option>

            <option value="Letícia Lima"></option>

            <option value="Breno Silva"></option>

            <option value="Léo Lima & Fernandes"></option>

            <option value="Lucas Henrique"></option>

            <option value="Mathias Fernandes"></option>

            <option value="Henrique Santana"></option>

            <option value="Noah James"></option>

            <option value="Luke Carter"></option>

            <option value="Ethan Grace"></option>

          </datalist>

        </label>


        <!-- ÁLBUM -->

        <label>
          Álbum

          <input
            id="album"
            type="text"
            placeholder="Ex: Deus Não Perdeu o Controle"
            required
          >

        </label>


        <!-- MÚSICA -->

        <label>
          Nome da música

          <input
            id="title"
            type="text"
            placeholder="Ex: No Tempo de Deus"
            required
          >

        </label>


        <!-- CATEGORIA -->

        <label>
          Categoria

          <select
            id="category"
            required
          >

            <option value="">
              Selecione
            </option>

            <option value="Adoração">
              Adoração
            </option>

            <option value="Sertanejo Gospel">
              Sertanejo Gospel
            </option>

            <option value="Forró Gospel">
              Forró Gospel
            </option>

            <option value="Arrocha Gospel">
              Arrocha Gospel
            </option>

            <option value="Seresta Gospel">
              Seresta Gospel
            </option>

            <option value="Pop Worship">
              Pop Worship
            </option>

            <option value="Christian Pop">
              Christian Pop
            </option>

            <option value="Acoustic Worship">
              Acoustic Worship
            </option>

            <option value="Bachata Gospel">
              Bachata Gospel
            </option>

            <option value="Gospel Vaqueiro">
              Gospel Vaqueiro
            </option>

            <option value="Podcasts">
              Podcasts
            </option>

          </select>

        </label>


        <!-- TEMA DA LETRA -->

        <label>
          Tema da letra

          <input
            id="lyricsTheme"
            type="text"
            placeholder="Ex: fé, promessa, esperança, não desistir"
          >

        </label>


        <!-- LETRA -->

        <label>
          Letra da música

          <textarea
            id="lyrics"
            placeholder="A letra pode ser gerada automaticamente ou colada aqui."
            rows="18"
          ></textarea>

        </label>


        <!-- BOTÕES DA LETRA -->

        <div
          style="
            display:flex;
            gap:10px;
            flex-wrap:wrap;
          "
        >

          <button
            type="button"
            id="generateLyricsButton"
            class="primary"
          >
            ✨ Gerar letra automaticamente
          </button>

          <button
            type="button"
            id="clearLyricsButton"
            style="
              border:1px solid #ffffff20;
              background:#102033;
              color:#fff;
              padding:14px 16px;
              border-radius:14px;
              font-weight:800;
              cursor:pointer;
            "
          >
            Limpar letra
          </button>

        </div>


        <!-- STATUS DA LETRA -->

        <div
          id="lyricsStatus"
          class="status"
        ></div>


        <!-- MP3 -->

        <label class="file-label">

          Arquivo MP3

          <input
            id="audioFile"
            type="file"
            accept=".mp3,audio/mpeg"
            required
          >

          <span id="audioName">
            Escolher música
          </span>

        </label>


        <!-- CAPA -->

        <label class="file-label">

          Capa

          <input
            id="coverFile"
            type="file"
            accept="image/*"
          >

          <span id="coverName">
            Escolher capa
          </span>

        </label>


        <!-- PROGRESSO -->

        <div
          class="progress-area hidden"
          id="progressArea"
        >

          <div class="progress-info">

            <span id="progressText">
              Enviando...
            </span>

            <strong id="progressPercent">
              0%
            </strong>

          </div>

          <div class="progress-bar">

            <div id="progressFill"></div>

          </div>

        </div>


        <!-- PUBLICAR -->

        <button
          type="submit"
          id="uploadButton"
          class="primary"
        >
          Publicar música
        </button>

      </form>


      <div
        id="status"
        class="status"
      ></div>

    </section>



    <!-- =========================
         BIBLIOTECA
    ========================== -->

    <section class="panel">

      <div class="panel-title">

        <small>
          BIBLIOTECA
        </small>

        <h2>
          Músicas publicadas
        </h2>

        <p>
          Músicas já disponíveis
          no Vem Comigo PLAY.
        </p>

      </div>


      <div
        id="musicList"
        class="music-list"
      >

        <div class="empty">
          Nenhuma música carregada ainda.
        </div>

      </div>

    </section>

  </main>


  <script src="admin.js"></script>


  <!-- =========================
       CONTROLES BÁSICOS DA LETRA
  ========================== -->

  <script>

    const lyricsBox =
      document.getElementById(
        "lyrics"
      );

    const clearLyricsButton =
      document.getElementById(
        "clearLyricsButton"
      );

    const generateLyricsButton =
      document.getElementById(
        "generateLyricsButton"
      );

    const lyricsStatus =
      document.getElementById(
        "lyricsStatus"
      );


    clearLyricsButton.onclick =
      () => {

        lyricsBox.value = "";

        lyricsStatus.textContent =
          "Letra limpa.";

      };


    generateLyricsButton.onclick =
      () => {

        if (
          typeof window.generateAutomaticLyrics
          === "function"
        ) {

          window.generateAutomaticLyrics();

          return;

        }

        lyricsStatus.textContent =
          "O gerador será ativado no admin.js.";

      };

  </script>

</body>
</html>
