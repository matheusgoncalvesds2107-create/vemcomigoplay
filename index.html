<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020812">

  <title>Vem Comigo PLAY</title>
  <meta
    name="description"
    content="Vem Comigo PLAY — músicas e podcasts da Vem Comigo Records."
  >

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <div class="brand">
      <img src="logo-play.png" alt="Vem Comigo PLAY">

      <div>
        <strong>Vem Comigo PLAY</strong>
        <span>Vem Comigo Records</span>
      </div>
    </div>

    <button id="searchToggle" class="iconbtn" aria-label="Buscar">
      ⌕
    </button>
  </header>

  <section id="searchBox" class="searchbox hidden">
    <input
      id="searchInput"
      type="search"
      placeholder="Buscar música, artista ou podcast"
    >
  </section>

  <nav class="chips" aria-label="Categorias">
    <button class="active" data-cat="Todos">Tudo</button>
    <button data-cat="Adoração">Adoração</button>
    <button data-cat="Sertanejo Gospel">Sertanejo</button>
    <button data-cat="Forró Gospel">Forró</button>
    <button data-cat="Arrocha Gospel">Arrocha</button>
    <button data-cat="Pop Worship">Pop Worship</button>
    <button data-cat="Podcasts">Podcasts</button>
  </nav>

  <main>

    <section class="hero">
      <small>CATÁLOGO OFICIAL</small>

      <h1>
        Vem Comigo<br>
        <em>PLAY</em>
      </h1>

      <p>
        Só nossas músicas, nossos artistas e nossos podcasts.
      </p>

      <div class="hero-actions">
        <button id="heroPlay">
          ▶ Ouvir agora
        </button>

        <button id="heroShuffle" class="secondary">
          ⇄ Aleatório
        </button>
      </div>
    </section>

    <section class="section">

      <div class="section-head">
        <div>
          <small>DESTAQUES</small>
          <h2>Louvores em destaque</h2>
        </div>

        <button id="playAll">
          Tocar tudo
        </button>
      </div>

      <div id="catalog" class="tracklist"></div>

    </section>

  </main>

  <footer class="player" id="player">

    <img
      id="cover"
      src="logo-play.svg"
      alt="Capa"
    >

    <div class="player-meta">

      <small id="kind">
        VEM COMIGO PLAY
      </small>

      <strong id="title">
        Escolha uma faixa
      </strong>

      <span id="artist">
        Player próprio do site
      </span>

      <div class="progress">

        <span id="cur">
          0:00
        </span>

        <input
          id="seek"
          type="range"
          min="0"
          max="100"
          value="0"
          aria-label="Progresso"
        >

        <span id="dur">
          0:00
        </span>

      </div>

    </div>

    <button
      id="prev"
      class="round"
      aria-label="Anterior"
    >
      ⏮
    </button>

    <button
      id="play"
      class="round main"
      aria-label="Tocar"
    >
      ▶
    </button>

    <button
      id="next"
      class="round"
      aria-label="Próxima"
    >
      ⏭
    </button>

    <div class="volume">

      <span>
        🔊
      </span>

      <input
        id="volume"
        type="range"
        min="0"
        max="1"
        step=".05"
        value=".85"
        aria-label="Volume"
      >

    </div>

    <audio
      id="audio"
      preload="metadata"
    ></audio>

  </footer>

  <script src="app.js"></script>

</body>
</html>
